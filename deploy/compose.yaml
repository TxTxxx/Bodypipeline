# Demo receiver image only. Production LeTools/Visualizer dependencies must be built separately.
services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["server", "--config", "/config/server.json", "--host", "0.0.0.0"]
    environment:
      PIPELINE_TOKEN: ${PIPELINE_TOKEN:?Set a random user token}
      PIPELINE_DEVICE_TOKEN: ${PIPELINE_DEVICE_TOKEN:?Set a different device token}
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - pipeline-data:/data
      - ./server.container.json:/config/server.json:ro
    restart: unless-stopped
volumes:
  pipeline-data:
