[project]
name = "embodied-pipeline-letools"
version = "0.1.0"
description = "Isolated conversion, Doctor and Visualizer toolchain"
requires-python = ">=3.12"
dependencies = ["letools", "letools-native==0.2.0", "msgpack>=1.1,<2", "pillow>=10,<13"]

[tool.uv]
package = false
required-version = ">=0.13.1,<0.14"

[tool.uv.sources]
# install_letools.sh checks out and verifies the pinned commit and submodules first.
letools = { path = "../../.runtime/vendor/letools" }
letools-native = { index = "letools-native" }

[[tool.uv.index]]
name = "letools-native"
url = "https://xieweikai.github.io/letools/simple"
explicit = true
